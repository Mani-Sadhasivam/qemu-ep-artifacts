name: build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish the artifact under'
        required: true
        default: build

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison cpio flex gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            libelf-dev libssl-dev xz-utils

      - name: Build the artifact
        run: ./build.sh

      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd out
          sha256sum pcie-ep-stack.tar.xz > pcie-ep-stack.tar.xz.sha256
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" \
              --title "PCIe Endpoint test artifact" \
              --notes "Guest kernel and root filesystem for the QEMU functional test tests/functional/aarch64/test_pcie_ep.py. Built by .github/workflows/build.yml from build.sh."
          gh release upload "$TAG" \
            pcie-ep-stack.tar.xz pcie-ep-stack.tar.xz.sha256
          {
            echo '## Artifact'
            echo
            echo '```'
            cat pcie-ep-stack.tar.xz.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
